name: Build Verification

# Builds real players so platform linker, native-plugin importer, stripping,
# and AOT problems surface in CI. The scheduled run covers the whole claimed
# first-class matrix; manual dispatch can isolate one target while provisioning
# or diagnosing a runner. Missing editors/modules are hard failures.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Platform to build"
        type: choice
        required: true
        default: "all"
        options:
          - all
          - WebGL
          - StandaloneWindows64
          - StandaloneLinux64
          - StandaloneOSX
          - Android
          - iOS
  schedule:
    - cron: '17 3 * * 0'

concurrency:
  group: build-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan target matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select targets
        id: matrix
        shell: pwsh
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          $matrix = ./.github/scripts/Get-BuildVerificationMatrix.ps1 -Target $env:REQUESTED_TARGET
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          Write-Host $matrix

  build:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      UNITY_EDITOR: ${{ matrix.unity_editor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Unity editor and platform module
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath $env:UNITY_EDITOR -PathType Leaf)) {
            Write-Host "::error::Unity editor was not found at '$env:UNITY_EDITOR'."
            exit 1
          }

          $module = Join-Path '${{ matrix.playback_engines }}' '${{ matrix.module }}'
          if (!(Test-Path -LiteralPath $module -PathType Container)) {
            Write-Host "::error::The ${{ matrix.target }} module was not found at '$module'. Install it through Unity Hub on this runner."
            exit 1
          }

          Write-Host "Using Unity '$env:UNITY_EDITOR' with module '$module'."

      - name: Build player
        shell: pwsh
        run: |
          $artifacts = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          $logFile = Join-Path $artifacts "build-${{ matrix.target }}.log"
          $env:NOWUI_BUILD_OUTPUT = Join-Path $artifacts "player-${{ matrix.target }}"

          $unityArgs = @(
            "-batchmode",
            "-nographics",
            "-projectPath", "$env:GITHUB_WORKSPACE",
            "-buildTarget", "${{ matrix.target }}",
            "-executeMethod", "NowUI.EditorCI.NowBuildVerification.Build",
            "-logFile", "$logFile"
          )

          $process = Start-Process -FilePath $env:UNITY_EDITOR -ArgumentList $unityArgs -PassThru -Wait -NoNewWindow

          if ($process.ExitCode -ne 0) {
            Write-Host "::error::Unity build for ${{ matrix.target }} failed with exit code $($process.ExitCode). Last log lines:"
            if (Test-Path -LiteralPath $logFile) {
              Get-Content -LiteralPath $logFile -Tail 120
            }
            exit $process.ExitCode
          }

          if (!(Test-Path -LiteralPath $env:NOWUI_BUILD_OUTPUT)) {
            Write-Host "::error::Unity reported success but produced no output at '$env:NOWUI_BUILD_OUTPUT'."
            exit 1
          }

          Write-Host "Build for ${{ matrix.target }} succeeded."
          Select-String -LiteralPath $logFile -Pattern "Build verification:" | ForEach-Object { $_.Line }

      - name: Link generated iOS player with Xcode
        if: matrix.target == 'iOS'
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE "artifacts/player-iOS/Unity-iPhone.xcodeproj"
          $derivedData = Join-Path $env:GITHUB_WORKSPACE "artifacts/ios-derived-data"
          $logFile = Join-Path $env:GITHUB_WORKSPACE "artifacts/xcodebuild-iOS.log"

          if (!(Test-Path -LiteralPath $project -PathType Container)) {
            Write-Host "::error::Unity did not generate '$project'."
            exit 1
          }

          & xcodebuild `
            -project $project `
            -scheme Unity-iPhone `
            -configuration Release `
            -sdk iphoneos `
            -derivedDataPath $derivedData `
            CODE_SIGNING_ALLOWED=NO `
            CODE_SIGNING_REQUIRED=NO `
            build 2>&1 | Tee-Object -FilePath $logFile
          $xcodeExitCode = $LASTEXITCODE

          if ($xcodeExitCode -ne 0) {
            Write-Host "::error::xcodebuild failed with exit code $xcodeExitCode."
            exit $xcodeExitCode
          }

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-verification-${{ matrix.target }}-logs
          path: |
            artifacts/build-${{ matrix.target }}.log
            artifacts/xcodebuild-${{ matrix.target }}.log
          if-no-files-found: ignore
